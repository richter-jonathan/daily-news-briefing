<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#161B22" media="(prefers-color-scheme: dark)">
<title>Morgen-Briefing</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
#progress {
  background: var(--top);
  transition: background-color 0.8s ease;
  position: fixed;
  height: 3px;
  z-index: 9999;
  width: 0%;
  top: 8px;
  left: 0px;
}

:root{
  --bg:#EEF1F4;      /* Morgennebel */
  --surface:#FFFFFF;
  --ink:#18212D;     /* Schiefer */
  --muted:#5B6675;
  --line:#D9DEE5;
  --paper:#FFFFFF;
  --de:#C7362F;      /* Klatschmohn */
  --int:#1F6F8B;     /* Petrol */
  --wi:#2F7A4A;      /* Tanne */
  --it:#4B4FC4;      /* Indigo */
  --top:#18212D;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#161B22;--surface:#1E242D;--ink:#E7EAEE;--muted:#9AA3AF;--line:#2C333D;--paper:#262D37;
    --de:#E8655D;--int:#4FA3C2;--wi:#5BB07B;--it:#8A8DF0;--top:#E7EAEE}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:calc(var(--safe-t) + 20px) 0 calc(var(--safe-b) + 84px)}
a{color:inherit}
.app{max-width:560px;margin:0 auto}

/* Kopf */
.head{padding:8px 20px 18px}
.head h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.head p{color:var(--muted);margin-top:6px;font-size:15px}

/* Top-Thema */
.top{margin:0 12px 34px;background:var(--surface);border-radius:22px;overflow:hidden;scroll-margin-top:16px}
.top figure{--c:var(--de)}
.top .body{padding:16px 18px 18px}
.top .kind{font-size:14px;font-weight:600;color:var(--muted)}
.top h2{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:4px 0 10px}
.top p{font-size:16px}

/* Rubriken */
section{padding:0 20px;margin-bottom:38px;scroll-margin-top:16px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
#de{--c:var(--de)} #int{--c:var(--int)} #wi{--c:var(--wi)} #it{--c:var(--it)} #extra{--c:var(--it)}

figure{display:block;--tint:color-mix(in srgb,var(--c) 15%,var(--bg))}
figure svg{display:block;width:100%;height:auto}
.lead figure{border-radius:16px;overflow:hidden;margin-bottom:12px}
.lead h3{font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin-bottom:6px}
.lead p{font-size:15.5px}

.row{display:grid;grid-template-columns:1fr 84px;gap:8px 14px;padding:16px 0 0;margin-top:16px;border-top:1px solid var(--line)}
.row h3{font-size:17px;font-weight:600;line-height:1.28;letter-spacing:-.01em;align-self:center}
.row figure{grid-row:1;grid-column:2;border-radius:12px;overflow:hidden;align-self:start;aspect-ratio:1}
.row p{grid-column:1/3}
.row figure svg{height:100%;object-fit:cover}
.row p{font-size:15px;color:var(--ink);opacity:.86}
.row .src{grid-column:1/3}

/* Mehr anzeigen */
.top .body{--c:var(--de)}
.row .more,.row .more-btn{grid-column:1/3;margin-top:4px}
.more{margin-top:12px}
.more[hidden]{display:none}
.more p{font-size:15px;opacity:1;color:var(--ink)}
.more p+p{margin-top:10px}
.more-btn{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;margin-top:12px;padding:10px 16px;
  border-radius:12px;font-size:15px;font-weight:600;color:var(--c);
  background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);
  transition:background-color .15s,transform .1s}
.more-btn:active{background:color-mix(in srgb,var(--c) 20%,transparent);transform:scale(.98)}
@media (hover:hover){.more-btn:hover{background:color-mix(in srgb,var(--c) 16%,transparent)}}
.more-btn:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:12px}
.more-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.more-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.more-btn,.more-btn svg{transition:none}.more-btn:active{transform:none}}

.src{margin-top:8px;font-size:13px;color:var(--muted)}
.src a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.src a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

.foot{padding:0 20px;color:var(--muted);font-size:13px}
.push{padding:16px 20px 0;font-size:14px;color:var(--muted)}
.push:empty{display:none}
.push p{margin-bottom:10px}
.push button{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.push button.quiet{background:none;border:0;padding:0;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.push textarea{display:block;width:100%;font:12px ui-monospace,monospace;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px;resize:none}

/* Tab-Leiste */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 10px calc(var(--safe-b) + 8px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;
  font-size:11.5px;font-weight:600;color:var(--muted)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on svg{stroke:var(--k)}

/* Illustrationen */
.f-c{fill:var(--c)} .f-i{fill:var(--ink)} .f-p{fill:var(--paper)} .f-t{fill:var(--tint)}
.s-c{stroke:var(--c);fill:none} .s-i{stroke:var(--ink);fill:none} .s-p{stroke:var(--paper);fill:none}
</style>
</head>
